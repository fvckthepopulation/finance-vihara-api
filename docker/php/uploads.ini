; Raise upload limits so phone photos / scanned docs (Tukar Faktur, Pembayaran
; attachments) aren't silently dropped by PHP before Laravel validates them.
; PHP defaults are upload_max_filesize=2M / post_max_size=8M which reject most
; phone photos. Keep these >= the Laravel `max:` validation rules.
upload_max_filesize = 25M
post_max_size = 30M
memory_limit = 256M
max_file_uploads = 20
max_execution_time = 120
